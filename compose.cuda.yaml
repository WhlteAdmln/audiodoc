# Usage: docker compose -f compose.yaml -f compose.cuda.yaml up --build
services:
  audiodoc:
    image: ${AUDIODOC_CUDA_IMAGE:-ghcr.io/whlteadmln/audiodoc:cuda}
    build:
      args:
        RUNTIME_BASE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04@sha256:ac55d124da4882b497f732d8dfd9a702d5447a5f29d08d56da6f64f0a1eb34bc
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
