repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "relaxed"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: "22.14.0"

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows

  - repo: local
    hooks:
      - id: shfmt-installer
        name: shfmt (installer)
        entry: shfmt -i 0 -d
        language: system
        types: [file]
        files: ^install\.sh$

      - id: shfmt-scripts
        name: shfmt (scripts)
        entry: shfmt -i 2 -sr -d
        language: system
        types: [file]
        files: ^(scripts/.*\.sh|deploy/.*\.sh(\.example)?)$

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: python
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
        types: [file]
        files: \.(sh|sh\.example)$

      - id: ruff-check
        name: Ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
