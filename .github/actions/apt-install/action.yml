name: Install CI system packages
description: >-
  Install one package list from .github/apt-packages, reusing the .deb files of
  the nightly apt cache whose versions match and downloading the rest.
inputs:
  packages:
    description: Name of a package list in .github/apt-packages without the .txt suffix
    required: true
runs:
  using: composite
  steps:
    - name: Compute apt cache key prefix
      id: key
      shell: bash
      env:
        PACKAGE_LISTS_HASH: ${{ hashFiles('.github/apt-packages/*.txt') }}
      run: echo "prefix=apt-${ImageOS}-${PACKAGE_LISTS_HASH}-" >> "${GITHUB_OUTPUT}"
    - name: Restore apt cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ steps.key.outputs.prefix }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
    - name: Install packages
      shell: bash
      env:
        APT_CACHE_DIR: ${{ runner.temp }}/apt-cache
        APT_CACHE_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PACKAGE_LIST: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        mapfile -t packages < ".github/apt-packages/${PACKAGE_LIST}.txt"
        debs=("${APT_CACHE_DIR}/${PACKAGE_LIST}"/*.deb)

        if [[ -n "${APT_CACHE_KEY}" && ${#debs[@]} -gt 0 ]]; then
          sudo cp "${debs[@]}" /var/cache/apt/archives/
          echo "Copied ${#debs[@]} .deb files of ${PACKAGE_LIST} from the apt cache ${APT_CACHE_KEY}"
        else
          echo "::notice::Installing ${PACKAGE_LIST} from the network: no usable apt cache"
        fi

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
