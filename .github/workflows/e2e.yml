name: Real Whisper E2E

on:
  workflow_call:

permissions: {}

jobs:
  e2e:
    name: Real Whisper smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface/hub
          key: ${{ runner.os }}-whisper-tiny-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-tiny-
      - name: Report Whisper cache status
        run: |
          echo "Exact Whisper cache hit: ${{ steps.whisper-cache.outputs.cache-hit }}"
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run real Whisper e2e test
        shell: bash
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::E2E tests must not be skipped in CI."
            exit 1
          fi
