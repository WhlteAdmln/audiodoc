name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish immediately instead of creating a draft release"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Real Whisper smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface/hub
          key: ${{ runner.os }}-whisper-tiny-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-tiny-
      - name: Report Whisper cache status
        env:
          WHISPER_CACHE_HIT: ${{ steps.whisper-cache.outputs.cache-hit }}
        run: |
          echo "Exact Whisper cache hit: ${WHISPER_CACHE_HIT}"
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run real Whisper e2e test
        shell: bash
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::E2E tests must not be skipped in CI."
            exit 1
          fi

  release:
    name: Build and publish release
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from the main branch." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: use semantic versioning without a leading v (for example, 0.1.0 or 0.2.0-rc.1)." >&2
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="$auth_header" \
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Unable to check whether tag ${tag} already exists (git ls-remote exited with ${status})." >&2
              exit "$status"
            fi
          fi

          echo "Validated release ${tag} from ${GITHUB_SHA}."

      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/build_release.sh "$RELEASE_VERSION"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one ZIP archive in dist/, found ${#archives[@]}." >&2
            exit 1
          fi
          test -s dist/SHA256SUMS
          if ! sha256sum --check --status dist/SHA256SUMS 2>/dev/null; then
            if ! (cd dist && sha256sum --check --status SHA256SUMS 2>/dev/null); then
              echo "SHA256SUMS does not validate the release archive." >&2
              exit 1
            fi
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          shopt -s nullglob
          archives=(dist/*.zip)
          release_args=(
            "$tag"
            "${archives[0]}"
            "dist/SHA256SUMS"
            --title "audiodoc ${RELEASE_VERSION}"
            --generate-notes
            --target "$GITHUB_SHA"
          )

          version_without_build="${RELEASE_VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if [[ "$PUBLISH" != "true" ]]; then
            release_args+=(--draft)
          fi

          gh release create "${release_args[@]}"
