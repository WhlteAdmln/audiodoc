name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build and upload release assets without creating a draft release or publishing the container image"
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Real Whisper smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface/hub
          key: ${{ runner.os }}-whisper-tiny-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-tiny-
      - name: Report Whisper cache status
        env:
          WHISPER_CACHE_HIT: ${{ steps.whisper-cache.outputs.cache-hit }}
        run: |
          echo "Exact Whisper cache hit: ${WHISPER_CACHE_HIT}"
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run real Whisper e2e test
        shell: bash
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::E2E tests must not be skipped in CI."
            exit 1
          fi

  release:
    name: Build and prepare draft release
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check "build>=1.2,<2.0"

      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from the main branch." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: use semantic versioning without a leading v (for example, 0.1.0 or 0.2.0-rc.1)." >&2
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          project_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "$project_version" != "$RELEASE_VERSION" ]]; then
            echo "pyproject.toml version (${project_version}) does not match requested release (${RELEASE_VERSION})." >&2
            exit 1
          fi

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="$auth_header" \
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Unable to check whether tag ${tag} already exists (git ls-remote exited with ${status})." >&2
              exit "$status"
            fi
          fi

          echo "Validated release ${tag} from ${GITHUB_SHA}."

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/release_notes.py \
            "$RELEASE_VERSION" \
            CHANGELOG.md \
            "$RUNNER_TEMP/release-notes.md"

      - name: Build source distribution and wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/build_release.sh "$RELEASE_VERSION"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/audiodoc-*.tar.gz)
          wheels=(dist/audiodoc-*.whl)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "Expected exactly one source distribution in dist/, found ${#sdists[@]}." >&2
            exit 1
          fi
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one audiodoc wheel in dist/, found ${#wheels[@]}." >&2
            exit 1
          fi
          test -s dist/constraints.txt
          test -s dist/SHA256SUMS
          (cd dist && sha256sum --check --status SHA256SUMS)

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/constraints.txt
            dist/SHA256SUMS

      - name: Add provenance bundle to release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" dist/build-provenance.sigstore.json

      - name: Upload release assets as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Log in to GHCR
        if: inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Build and publish versioned Docker image
        if: inputs.dry_run == false
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker build --pull --tag "${image}:${RELEASE_VERSION}" .
          docker push "${image}:${RELEASE_VERSION}"

      - name: Create draft GitHub release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${RELEASE_VERSION}"
          gh release create "$tag" dist/* \
            --title "audiodoc ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --target "$GITHUB_SHA"
