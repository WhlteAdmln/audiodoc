name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: pre-commit run --all-files
      - name: Check requirements and lock file
        run: python scripts/check_lock.py

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lock
            experimental: false
          - python-version: "3.12"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: latest
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        if: matrix.deps == 'lock'
        run: python -m pip install -r requirements-dev.txt
      - name: Install latest allowed dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install -r requirements.txt \
            pytest pytest-asyncio pytest-cov \
            pytest-randomly pytest-timeout httpx2 packaging aiohttp \
            hypothesis jsonschema
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run unit tests with coverage (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -m "not integration and not e2e" \
            --cov=backend --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html \
            --junitxml=junit.xml | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Unit tests must not be skipped in CI."
            exit 1
          fi
      - name: Write coverage summary
        if: matrix.deps == 'lock' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.deps == 'lock' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  integration:
    name: Integration (OCR / DjVu)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install native OCR and DjVu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng djvulibre-bin
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run integration tests (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -m integration | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Integration tests must not be skipped in CI."
            exit 1
          fi

  deploy:
    name: Deployment examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deployment validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck systemd wireguard-tools
          python -m pip install shfmt-py==4.0.0

      - name: Verify systemd service example
        shell: bash
        run: |
          set -euo pipefail
          service_root="${RUNNER_TEMP}/audiodoc"
          service_file="${RUNNER_TEMP}/audiodoc.service"
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          mkdir -p "${service_root}/tmp"
          : > "${service_root}/.env"

          sed \
            -e "s|^User=audiodoc$|User=${runner_user}|" \
            -e "s|^Group=audiodoc$|Group=${runner_group}|" \
            -e "s|^WorkingDirectory=/opt/audiodoc$|WorkingDirectory=${service_root}|" \
            -e "s|^EnvironmentFile=/opt/audiodoc/.env$|EnvironmentFile=${service_root}/.env|" \
            -e 's|^ExecStart=/opt/audiodoc/venv/bin/uvicorn .*|ExecStart=/usr/bin/true|' \
            -e "s|^ReadWritePaths=/opt/audiodoc/tmp$|ReadWritePaths=${service_root}/tmp|" \
            deploy/audiodoc.service.example > "${service_file}"
          systemd-analyze verify "${service_file}"

      - name: Check UFW rules example
        run: |
          shellcheck --shell=sh deploy/ufw-rules.sh.example
          shfmt -i 2 -sr -d deploy/ufw-rules.sh.example

      - name: Test nginx configuration in the official image
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="${RUNNER_TEMP}/audiodoc-nginx-certs"
          mkdir -p "${cert_dir}"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "${cert_dir}/privkey.pem" \
            -out "${cert_dir}/fullchain.pem" \
            -days 1 \
            -subj "/CN=backend.example.internal"
          docker run --rm --pull=always \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/deploy/nginx.conf.example,dst=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,src=${cert_dir},dst=/etc/ssl/audiodoc,readonly" \
            nginx:stable-alpine nginx -t

  e2e:
    name: Real Whisper smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface/hub
          key: ${{ runner.os }}-whisper-tiny-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-tiny-
      - name: Report Whisper cache status
        env:
          WHISPER_CACHE_HIT: ${{ steps.whisper-cache.outputs.cache-hit }}
        run: |
          echo "Exact Whisper cache hit: ${WHISPER_CACHE_HIT}"
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run real Whisper e2e test
        shell: bash
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::E2E tests must not be skipped in CI."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

  build:
    name: Build release archive
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build archive and checksum
        run: bash scripts/build_release.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive
          path: dist/
          retention-days: 7
