name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check requirements and lock file
        run: python scripts/check_lock.py
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Check installer
        run: shellcheck --shell=sh install.sh

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lock
            experimental: false
          - python-version: "3.12"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: latest
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        if: matrix.deps == 'lock'
        run: python -m pip install -r requirements-dev.txt
      - name: Install latest allowed dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install -r requirements.txt \
            pytest pytest-asyncio pytest-cov httpx2 packaging
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run unit tests with coverage (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -o addopts='' -m "not integration" \
            --cov=backend --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html \
            --junitxml=junit.xml | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Unit tests must not be skipped in CI."
            exit 1
          fi
      - name: Write coverage summary
        if: matrix.deps == 'lock' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.deps == 'lock' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  integration:
    name: Integration (OCR / DjVu)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install native OCR and DjVu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng djvulibre-bin
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run integration tests (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -o addopts='' -m integration | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Integration tests must not be skipped in CI."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

  build:
    name: Build release archive
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build archive and checksum
        run: bash scripts/build_release.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-archive
          path: dist/
          retention-days: 7
