name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: pre-commit run --all-files
      - name: Check requirements and lock file
        run: python scripts/check_lock.py

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.deps }})
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lock
            experimental: false
          - python-version: "3.12"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: lock
            experimental: false
          - python-version: "3.13"
            deps: latest
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        if: matrix.deps == 'lock'
        run: python -m pip install -r requirements-dev.txt
      - name: Install latest allowed dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install -r requirements.txt \
            pytest pytest-asyncio pytest-cov \
            pytest-randomly pytest-timeout httpx2 packaging aiohttp \
            hypothesis jsonschema build setuptools==84.2.1 wheel==0.48.0
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run unit tests with coverage (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -m "not integration and not e2e" \
            --cov=audiodoc --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml --cov-report=html \
            --junitxml=junit.xml | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Unit tests must not be skipped in CI."
            exit 1
          fi
      - name: Write coverage summary
        if: matrix.deps == 'lock' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.deps == 'lock' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit.xml
          retention-days: 14

  integration:
    name: Integration (OCR / DjVu)
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Install native OCR and DjVu tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng djvulibre-bin
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run integration tests (skips are failures)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs -m integration | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::Integration tests must not be skipped in CI."
            exit 1
          fi

  deploy:
    name: Deployment examples
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deployment validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck systemd wireguard-tools
          python -m pip install shfmt-py==4.0.0

      - name: Verify systemd service example
        shell: bash
        run: |
          set -euo pipefail
          service_root="${RUNNER_TEMP}/audiodoc"
          service_file="${RUNNER_TEMP}/audiodoc.service"
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          mkdir -p "${service_root}/tmp"
          : > "${service_root}/.env"

          AUDIODOC_HOME="${service_root}" python - <<'PY' > "${service_file}"
          import os
          from pathlib import Path

          from audiodoc.service import render_service_unit

          print(
              render_service_unit(
                  Path(os.environ["AUDIODOC_HOME"]),
                  mode="system",
              ),
              end="",
          )
          PY
          sed \
            -e "s|^User=audiodoc$|User=${runner_user}|" \
            -e "s|^Group=audiodoc$|Group=${runner_group}|" \
            -e 's|^ExecStart=.*|ExecStart=/usr/bin/true|' \
            "${service_file}" > "${service_file}.tmp"
          mv "${service_file}.tmp" "${service_file}"
          systemd-analyze verify "${service_file}"

      - name: Check UFW rules example
        run: |
          shellcheck --shell=sh deploy/ufw-rules.sh.example
          shfmt -i 2 -sr -d deploy/ufw-rules.sh.example

      - name: Test nginx configuration in the official image
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="${RUNNER_TEMP}/audiodoc-nginx-certs"
          mkdir -p "${cert_dir}"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "${cert_dir}/privkey.pem" \
            -out "${cert_dir}/fullchain.pem" \
            -days 1 \
            -subj "/CN=backend.example.internal"
          docker run --rm --pull=always \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/deploy/nginx.conf.example,dst=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,src=${cert_dir},dst=/etc/ssl/audiodoc,readonly" \
            nginx:stable-alpine nginx -t

  e2e:
    name: Real Whisper smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-lock.txt
            requirements-dev.txt
      - name: Cache Whisper model
        id: whisper-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/huggingface/hub
          key: ${{ runner.os }}-whisper-tiny-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-whisper-tiny-
      - name: Report Whisper cache status
        env:
          WHISPER_CACHE_HIT: ${{ steps.whisper-cache.outputs.cache-hit }}
        run: |
          echo "Exact Whisper cache hit: ${WHISPER_CACHE_HIT}"
      - name: Install eSpeak NG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run real Whisper e2e test
        shell: bash
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::E2E tests must not be skipped in CI."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit locked dependencies
        run: pip-audit -r requirements-lock.txt

  build:
    name: Build release assets and smoke-test installer
    needs: [test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install installer smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck tesseract-ocr tesseract-ocr-rus \
            tesseract-ocr-eng djvulibre-bin
          python -m pip install pytest==9.2.0 pytest-asyncio==1.4.1.post1 pytest-timeout==2.4.0 shfmt-py==4.0.0
      - name: Check installer shell
        run: |
          shellcheck --shell=sh install.sh
          shfmt -i 0 -d install.sh
      - name: Build archive, wheel and checksums
        run: bash scripts/build_release.sh "$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
      - name: Install and upgrade from a locally served release
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          next_release_version="$(python - "$release_version" <<'PY'
          import sys

          parts = sys.argv[1].split(".")
          if not parts[-1].isdigit():
              raise SystemExit("Release version must end in a numeric component.")
          parts[-1] = str(int(parts[-1]) + 1)
          print(".".join(parts))
          PY
          )"

          pyproject_backup="${RUNNER_TEMP}/pyproject.toml"
          cp pyproject.toml "$pyproject_backup"
          server_pid=""

          cleanup() {
            result=$?
            trap - EXIT
            cp "$pyproject_backup" pyproject.toml
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            exit "$result"
          }
          trap cleanup EXIT

          release_url="http://127.0.0.1:8765"
          python -m http.server 8765 --bind 127.0.0.1 --directory dist \
            > "${RUNNER_TEMP}/release-server.log" 2>&1 &
          server_pid=$!

          attempt=0
          while [ "$attempt" -lt 30 ]; do
            attempt=$((attempt + 1))
            if curl -fsS "${release_url}/SHA256SUMS" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "${release_url}/SHA256SUMS" >/dev/null

          user_home="${RUNNER_TEMP}/audiodoc-user"
          app_home="${RUNNER_TEMP}/audiodoc-app"
          mkdir -p "$user_home"

          HOME="$user_home" \
            AUDIODOC_HOME="$app_home" \
            AUDIODOC_RELEASE_URL="$release_url" \
            AUDIODOC_RELEASE_TAG="$release_version" \
            sh install.sh --no-model

          installed_version="$("$app_home/.venv/bin/python" -c 'from importlib.metadata import version; print(version("audiodoc"))')"
          test "$installed_version" = "$release_version"

          printf '%s\n' 'CI_INSTALLER_SMOKE=preserve-me' >> "$app_home/.env"

          model_dir="$app_home/models/ci-smoke"
          mkdir -p "$model_dir"
          printf '%s\n' '{}' > "$model_dir/config.json"
          printf '%s\n' 'ci-smoke-model' > "$model_dir/model.bin"
          python - "$app_home/.env" "$model_dir" <<'PY'
          import sys
          from pathlib import Path

          env_path = Path(sys.argv[1])
          model_path = sys.argv[2]
          lines = env_path.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.partition("=")[0] == "WHISPER_MODEL_PATH"]
          if len(matches) > 1:
              raise SystemExit("Expected exactly one WHISPER_MODEL_PATH setting.")
          setting = f'WHISPER_MODEL_PATH="{model_path}"'
          if matches:
              lines[matches[0]] = setting
          else:
              lines.append(setting)
          env_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cp "$app_home/.env" "${RUNNER_TEMP}/audiodoc.env"

          python - "$release_version" "$next_release_version" <<'PY'
          import sys
          from pathlib import Path

          path = Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")
          old_version, new_version = sys.argv[1:]
          old_line = f'version = "{old_version}"'
          if content.count(old_line) != 1:
              raise SystemExit("Could not identify the project version in pyproject.toml.")
          path.write_text(
              content.replace(old_line, f'version = "{new_version}"', 1),
              encoding="utf-8",
          )
          PY

          bash scripts/build_release.sh "$next_release_version"

          HOME="$user_home" \
            AUDIODOC_HOME="$app_home" \
            AUDIODOC_RELEASE_URL="$release_url" \
            AUDIODOC_RELEASE_TAG="$next_release_version" \
            sh install.sh --upgrade

          installed_version="$("$app_home/.venv/bin/python" -c 'from importlib.metadata import version; print(version("audiodoc"))')"
          test "$installed_version" = "$next_release_version"
          cmp "${RUNNER_TEMP}/audiodoc.env" "$app_home/.env"

          cp "$pyproject_backup" pyproject.toml
          bash scripts/build_release.sh "$release_version"
      - name: Test installer rollback and isolated installation flows
        run: python -m pytest -q tests/unit/test_installer.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          retention-days: 7

  container:
    name: Docker image smoke test
    needs: [test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Compose environment file
        run: touch .env
      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.cuda.yaml config --quiet
      - name: Build Docker image
        run: docker compose -f compose.yaml build --pull audiodoc
      - name: Initialize persistent volume and run doctor
        run: |
          set -euo pipefail
          docker compose -f compose.yaml run --rm --no-deps audiodoc init --model tiny
          docker compose -f compose.yaml run --rm --no-deps audiodoc doctor
          docker compose -f compose.yaml down --volumes

  publish-container:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
      - name: Build and publish Docker image
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker build --pull \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:latest" \
            .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
