name: Bug report
description: Report a reproducible problem with audiodoc.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, credentials, personal data, or real uploaded files.
        Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps and synthetic input examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: false
