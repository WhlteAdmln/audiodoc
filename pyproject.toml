[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodoc"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tmp", "models"]
namespace-packages = ["scripts", "tests/contract", "tests/integration", "tests/unit"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
    "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN", "D", "SLF001", "ARG"]


[tool.mypy]
mypy_path = "typings"
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

# odfpy does not provide type information.
[[tool.mypy.overrides]]
module = ["odf", "odf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = [
    "error",
    "ignore:^builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute$:DeprecationWarning",
]
timeout = 30
markers = [
    "unit: isolated unit tests",
    "integration: requires Tesseract OCR (rus/eng) and DjVuLibre native tools",
    "contract: verifies compatibility with external interfaces",
    "e2e: exercises complete application workflows",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 87
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.deptry]
requirements_files_dev = ["requirements-dev.txt"]
known_first_party = ["backend"]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
# Runtime dependencies consumed outside ordinary static imports.
DEP002 = [
    "uvicorn",
    "python-multipart",
    "av",
    "faster-whisper",  # Loaded dynamically by the transcription model holder.
    "pytesseract",  # Loaded dynamically by the OCR adapter.
]

[tool.vulture]
paths = [
    "backend",
    "app.py",
    "scripts/check_lock.py",
    "scripts/vulture_whitelist.py",
]
min_confidence = 80

[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "API may import all lower-level packages"
type = "layers"
layers = [
    "backend.api",
    "backend.document_engine : backend.transcription",
    "backend.common",
    "backend.config",
    "backend.errors",
]

[[tool.importlinter.contracts]]
name = "Document engine has no forbidden dependencies"
type = "forbidden"
source_modules = ["backend.document_engine"]
forbidden_modules = [
    "backend.api",
    "backend.transcription",
    "backend.config",
]

[[tool.importlinter.contracts]]
name = "Errors are independent of application packages"
type = "forbidden"
source_modules = ["backend.errors"]
forbidden_modules = [
    "backend.main",
    "backend.api",
    "backend.document_engine",
    "backend.transcription",
    "backend.common",
    "backend.config",
]

[[tool.importlinter.contracts]]
name = "Common imports only errors from the application"
type = "forbidden"
source_modules = ["backend.common"]
forbidden_modules = [
    "backend.main",
    "backend.api",
    "backend.document_engine",
    "backend.transcription",
    "backend.config",
]

[[tool.importlinter.contracts]]
name = "Config is independent of application packages"
type = "forbidden"
source_modules = ["backend.config"]
forbidden_modules = [
    "backend.main",
    "backend.api",
    "backend.document_engine",
    "backend.transcription",
    "backend.common",
    "backend.errors",
]
