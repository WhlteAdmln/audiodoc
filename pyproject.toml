# VENDORED: keep identical in bot-obormot and audiodoc. Source of truth: audiodoc.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodoc"
version = "0.3.1"
requires-python = ">=3.11.5"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.162.5,<1.0",
    "pydantic>=2.14.2,<3.0.0",
    "starlette>=1.10.0,<2.0.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "faster-whisper>=1.0,<2.0",
    "av==18.1.0",
    "numpy>=2.0,<3.0",
    "pymupdf>=2.1,<3.0",
    "python-docx>=1.2.0,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "python-pptx>=1.0.2,<2.0",
    "ebooklib>=0.21,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "odfpy>=1.4.1,<2.0",
    "striprtf>=0.0.26,<1.0",
    "pytesseract>=0.3.10,<1.0",
    "Pillow>=13.0.0,<14.0.0",
    "defusedxml>=0.7.1,<1.0",
    "python-dotenv>=1.2.4,<2.0",
]

[project.optional-dependencies]
test = [
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "aiohttp==3.14.5",
    "packaging==26.3",
    "httpx2==2.16.0",
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "build>=1.2,<2.0",
]
dev = [
    "audiodoc[test]",
    "deptry==0.25.1",
    "import-linter==2.16",
    "vulture==2.16",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pylint==4.1.4",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "shfmt-py==4.0.0",
    "shellcheck-py==0.11.0.1",
]

[project.scripts]
audiodoc = "audiodoc.cli:main"

[tool.setuptools.packages.find]
include = ["audiodoc*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["data", "tmp", "models", "build"]
namespace-packages = ["scripts", "tests/contract", "tests/integration", "tests/unit"]

[tool.ruff.lint]
select = ["ALL"]
allowed-confusables = ["×", "А", "В", "Е", "К", "Н", "О", "С", "У", "а", "б", "г", "е", "о", "р", "с", "у", "х", "ℹ"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.isort]
# A leftover build/ directory must not turn the build package into first-party.
known-third-party = ["build"]

[tool.ruff.lint.per-file-ignores]
# D103: descriptive test names replace docstrings of test functions.
"tests/*" = ["S101", "D103"]
# The stub mirrors the name of the third-party function.
"typings/pymupdf/*" = ["A001"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
persistent = false
extension-pkg-allow-list = ["av"]
fail-under = 10.0
# Informational messages fail the run except I0011 and I0020, which only report
# that a narrow, reasoned "# pylint: disable" is in use.
fail-on = ["I0001", "I0010", "I0013", "I0021", "I0022", "I1101"]
load-plugins = [
    "pylint.extensions.bad_builtin",
    "pylint.extensions.broad_try_clause",
    "pylint.extensions.code_style",
    "pylint.extensions.comparison_placement",
    "pylint.extensions.confusing_elif",
    "pylint.extensions.consider_refactoring_into_while_condition",
    "pylint.extensions.consider_ternary_expression",
    "pylint.extensions.dict_init_mutate",
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
    "pylint.extensions.empty_comment",
    "pylint.extensions.for_any_all",
    "pylint.extensions.magic_value",
    "pylint.extensions.mccabe",
    "pylint.extensions.no_self_use",
    "pylint.extensions.overlapping_exceptions",
    "pylint.extensions.private_import",
    "pylint.extensions.redefined_loop_name",
    "pylint.extensions.redefined_variable_type",
    "pylint.extensions.set_membership",
    "pylint.extensions.typing",
]

[tool.pylint.messages_control]
enable = ["all"]
disable = [
    # A walrus inside a condition, especially a negated one, reads worse than two
    # plain lines, and no other gate asks for it.
    "consider-using-assignment-expr",
    # An explicit comparison with 0 states the intent for return codes and sizes.
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# A class with one public method is a legitimate single entry point (middleware,
# log filter, callback); classes without public methods are still reported.
min-public-methods = 1
# Protocol classes describe attributes for the type checker and have no methods.
exclude-too-few-public-methods = [".*Protocol$"]
max-args = 6
max-positional-arguments = 6
max-statements = 40
max-branches = 12
max-complexity = 10

[tool.pylint.broad_try_clause]
# Technical debt: every try block longer than one statement is reported and is
# restructured gradually (the narrowest try keeps the handled exception precise).
max-try-statements = 1

[tool.pylint.similarities]
min-similarity-lines = 4

[tool.pylint.parameter_documentation]
# The docstrings are one-line summaries with Args/Returns/Raises only where they add
# information; requiring all sections would only repeat the typed signatures.
# pylint still checks every section that is written against the signature.
accept-no-param-doc = true
accept-no-raise-doc = true
accept-no-return-doc = true
accept-no-yields-doc = true
default-docstring-type = "google"

[tool.pylint.basic]
# Settings fields mirror environment variable names, so UPPER_CASE is accepted.
attr-rgx = "([a-z_][a-z0-9_]*|[A-Z][A-Z0-9_]*)$"
# Test functions have no docstrings: descriptive test names replace them.
no-docstring-rgx = "^(_|test_)"

[tool.pylint.exceptions]
# ruff BLE001 already requires broad handlers to log or re-raise.
overgeneral-exceptions = ["builtins.BaseException"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = [
    "error",
    # Third-party: the SWIG bindings of PyMuPDF raise these on import.
    "ignore:^builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute$:DeprecationWarning",
]
timeout = 30
markers = [
    "unit: isolated unit tests",
    "integration: requires Tesseract OCR (rus/eng) and DjVuLibre native tools",
    "contract: verifies compatibility with external interfaces",
    "e2e: exercises complete application workflows",
]

[tool.coverage.run]
branch = true
source = ["audiodoc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92.95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

[tool.deptry]
optional_dependencies_dev_groups = ["dev", "test"]
known_first_party = ["audiodoc"]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
# Runtime dependencies consumed outside ordinary static imports.
DEP002 = [
    "python-multipart",  # Used by FastAPI to parse form and file uploads.
    "faster-whisper",  # Loaded dynamically by the transcription model holder.
    "pytesseract",  # Loaded dynamically by the OCR adapter.
]

[tool.vulture]
paths = [
    "audiodoc",
    "scripts/check_lock.py",
]
min_confidence = 80
# Parameter names of the Protocol that describes faster_whisper's transcribe().
ignore_names = ["beam_size", "vad_filter"]

[tool.importlinter]
root_package = "audiodoc"

[[tool.importlinter.contracts]]
name = "API may import all lower-level packages"
type = "layers"
layers = [
    "audiodoc.api",
    "audiodoc.document_engine : audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.config",
    "audiodoc.errors",
]

[[tool.importlinter.contracts]]
name = "Document engine has no forbidden dependencies"
type = "forbidden"
source_modules = ["audiodoc.document_engine"]
forbidden_modules = [
    "audiodoc.api",
    "audiodoc.transcription",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Errors are independent of application packages"
type = "forbidden"
source_modules = ["audiodoc.errors"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Common imports only errors from the application"
type = "forbidden"
source_modules = ["audiodoc.common"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Config is independent of application packages"
type = "forbidden"
source_modules = ["audiodoc.config"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.errors",
]
