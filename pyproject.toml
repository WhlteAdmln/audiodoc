[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

# defusedxml does not provide type information.
[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

# openpyxl does not provide type information.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# odfpy does not provide type information.
[[tool.mypy.overrides]]
module = ["odf", "odf.*"]
ignore_missing_imports = true

# pytesseract does not provide type information.
[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true

# faster-whisper does not provide type information.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
