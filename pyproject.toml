# VENDORED: keep identical in bot-obormot and audiodoc. Source of truth: audiodoc.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodoc"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.14.2,<3.0.0",
    "starlette>=1.10.0,<2.0.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "faster-whisper>=1.0,<2.0",
    "av==18.1.0",
    "numpy>=2.0,<3.0",
    "pymupdf>=2.1,<3.0",
    "python-docx>=1.2.0,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "python-pptx>=1.0.2,<2.0",
    "ebooklib>=0.21,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "odfpy>=1.4.1,<2.0",
    "striprtf>=0.0.26,<1.0",
    "pytesseract>=0.3.10,<1.0",
    "Pillow>=13.0.0,<14.0.0",
    "defusedxml>=0.7.1,<1.0",
    "python-dotenv>=1.2.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "aiohttp==3.14.5",
    "deptry==0.25.1",
    "import-linter==2.16",
    "vulture==2.16",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "shfmt-py==4.0.0",
    "shellcheck-py==0.11.0.1",
    "packaging==26.3",
    "httpx2==2.16.0",
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "build>=1.6.1,<2.0",
]

[project.scripts]
audiodoc = "audiodoc.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["audiodoc*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tmp", "models", "build"]
namespace-packages = ["scripts", "tests/contract", "tests/integration", "tests/unit"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "TD002",
    "TD003",
    "FIX002",
    "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ANN", "D", "SLF001", "ARG"]


[tool.mypy]
mypy_path = "typings"
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

# odfpy does not provide type information.
[[tool.mypy.overrides]]
module = ["odf", "odf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
filterwarnings = [
    "error",
    "ignore:^builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute$:DeprecationWarning",
]
timeout = 30
markers = [
    "unit: isolated unit tests",
    "integration: requires Tesseract OCR (rus/eng) and DjVuLibre native tools",
    "contract: verifies compatibility with external interfaces",
    "e2e: exercises complete application workflows",
]

[tool.coverage.run]
branch = true
source = ["audiodoc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 92.95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]
known_first_party = ["audiodoc"]
extend_exclude = ["scripts"]

[tool.deptry.per_rule_ignores]
# Runtime dependencies consumed outside ordinary static imports.
DEP002 = [
    "uvicorn",
    "python-multipart",
    "av",
    "faster-whisper",  # Loaded dynamically by the transcription model holder.
    "pytesseract",  # Loaded dynamically by the OCR adapter.
]

[tool.vulture]
paths = [
    "audiodoc",
    "app.py",
    "scripts/check_lock.py",
    "scripts/vulture_whitelist.py",
]
min_confidence = 80

[tool.importlinter]
root_package = "audiodoc"

[[tool.importlinter.contracts]]
name = "API may import all lower-level packages"
type = "layers"
layers = [
    "audiodoc.api",
    "audiodoc.document_engine : audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.config",
    "audiodoc.errors",
]

[[tool.importlinter.contracts]]
name = "Document engine has no forbidden dependencies"
type = "forbidden"
source_modules = ["audiodoc.document_engine"]
forbidden_modules = [
    "audiodoc.api",
    "audiodoc.transcription",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Errors are independent of application packages"
type = "forbidden"
source_modules = ["audiodoc.errors"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Common imports only errors from the application"
type = "forbidden"
source_modules = ["audiodoc.common"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.config",
]

[[tool.importlinter.contracts]]
name = "Config is independent of application packages"
type = "forbidden"
source_modules = ["audiodoc.config"]
forbidden_modules = [
    "audiodoc.main",
    "audiodoc.api",
    "audiodoc.document_engine",
    "audiodoc.transcription",
    "audiodoc.common",
    "audiodoc.errors",
]
