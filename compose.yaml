# Copy .env.example to .env before running Compose.
# API keys are generated by `docker compose run --rm audiodoc init`
# and persisted in the audiodoc_data volume.
services:
  audiodoc:
    image: ${AUDIODOC_IMAGE:-ghcr.io/whlteadmln/audiodoc:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_BASE: python:3.12-slim
    env_file:
      - .env
    environment:
      AUDIODOC_HOME: /data
      HF_HOME: /data/models
      AUDIODOC_HOST: 0.0.0.0
      AUDIODOC_PORT: "8000"
    ports:
      - "${AUDIODOC_PUBLISH_ADDRESS:-127.0.0.1}:${AUDIODOC_PUBLISH_PORT:-8000}:8000"
    volumes:
      - audiodoc_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    init: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${AUDIODOC_CPU_LIMIT:-4.0}"
          memory: "${AUDIODOC_MEMORY_LIMIT:-8G}"

volumes:
  audiodoc_data:
